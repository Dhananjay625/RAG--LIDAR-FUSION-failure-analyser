<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LiDAR Failure Analyzer</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand">LiDAR Analyzer</span>
      <button class="btn-new" id="new-chat">+ New chat</button>
    </div>
    <nav class="chat-list" id="chat-list"></nav>
    <div class="sidebar-foot">
      <span class="dot" id="health-dot"></span>
      <span id="health-text">checking…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
      <h1 id="chat-title">New chat</h1>
    </header>

    <section class="messages" id="messages">
      <div class="empty" id="empty-state">
        <h2>Diagnose a sensor-fusion failure</h2>
        <p>Ask in plain language. Answers are grounded in your indexed papers.</p>
        <div class="examples" id="examples"></div>
      </div>
    </section>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Describe the failure or ask a question…"></textarea>
      <button type="submit" id="send" aria-label="Send">↑</button>
    </form>
    <p class="hint">Enter to send · Shift+Enter for a new line</p>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
